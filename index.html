<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blue Music Player</title>

    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="music-app">

        <!-- LEFT -->
        <div class="favorites-section">
            <h3>Favorite Songs</h3>
            <div class="favorite-list" id="favorite-list"></div>
        </div>

        <!-- PLAYLIST -->

        <div class="playlist-section">
            <h3>Playlist</h3>
            <div class="playlist-list" id="playlist"></div>
        </div>

        <!-- CENTER PLAYER -->
        <div class="player">

            <div class="album-wrapper">

                <img id="album-art" src="" alt="Album Cover">

                <!-- FIX: HEART ICON -->
                <button id="favorite-btn" class="icon-btn">
                    <i class="fa-regular fa-heart"></i>
                </button>

            </div>

            <h2 id="song-title">Song Title</h2>

            <p id="artist-name">Artist Name</p>

            <p id="genre">Genre</p>

            <audio id="audio-player"></audio>

            <input type="range" id="progress-slider">

            <div class="time">
                <span id="current-time">0:00</span>
                <span id="duration">0:00</span>
            </div>

            <div class="controls">

                <!-- FIX: SHUFFLE -->
                <button id="shuffle-btn" class="icon-btn">
                    <i class="fa-solid fa-shuffle"></i>
                </button>

                <button id="prev-btn">
                    <i class="fa-solid fa-backward-step"></i>
                </button>

                <button id="play-pause-btn">
                    <i class="fa-solid fa-play"></i>
                </button>

                <button id="next-btn">
                    <i class="fa-solid fa-forward-step"></i>
                </button>

                <!-- FIX: REPEAT -->
                <button id="repeat-btn" class="icon-btn">
                    <i class="fa-solid fa-repeat"></i>
                </button>

            </div>

            <input type="range" id="volume-slider">

        </div>

        <!-- RIGHT -->
        <div class="recently-played">
            <h3>Recently Played</h3>
            <div class="recent-list" id="recent-list"></div>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
